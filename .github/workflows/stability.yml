name: Stability contracts

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, json, mbstring, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax
        run: find api core config database ops -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find app admin assets/js tests -name '*.js' -o -name '*.mjs' | while read -r file; do node --check "$file"; done

      - name: Stability tests
        run: node --test tests/*.test.mjs
